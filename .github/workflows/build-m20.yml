name: Build Pox Kernel for Samsung Galaxy M20 (m20lte)

on:
  push:
    branches: [onyx, main]
  workflow_dispatch:
    inputs:
      variant:
        description: "Variant to build (all, vanilla, apatch, ksu-next)"
        required: false
        default: "all"

jobs:
  build:
    name: Build Pox Kernel (${{ matrix.variant }})
    runs-on: ubuntu-22.04
    if: github.event.inputs.variant == '' || github.event.inputs.variant == 'all' || github.event.inputs.variant == matrix.variant
    strategy:
      fail-fast: false
      matrix:
        variant: [vanilla, apatch, ksu-next]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install deps (22.04-compatible)
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libncurses-dev \
            ccache zip unzip cpio device-tree-compiler lzop libtinfo6 \
            gcc make python3 curl || true
          sudo apt-get install -y lib32z1 lib32stdc++6 2>/dev/null || true
          sudo ln -sf /usr/bin/python3 /usr/bin/python 2>/dev/null || true
          which ccache gcc python3 make dtc || true

      - name: Show toolchain
        run: |
          chmod +x prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/* || true
          prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-gcc --version || true
          gcc --version
          python3 --version
          make --version | head -1

      - name: Prepare variant (${{ matrix.variant }})
        run: |
          set -e
          case "${{ matrix.variant }}" in
            apatch)
              echo "Applying APatch patch..."
              patch -p1 < patches/apatch.patch
              echo "DEFCONFIG=exynos7885-m20_apatch_defconfig" >> $GITHUB_ENV
              echo "EDITION=Onyx-APatch" >> $GITHUB_ENV
              echo "ZIP_NAME=Pox-Kernel-1.0.0-Beta-Onyx-APatch-m20lte.zip" >> $GITHUB_ENV
              ;;
            ksu-next)
              echo "Applying KernelSU-Next patch..."
              patch -p1 < patches/ksu.patch
              echo "Cloning KernelSU-Next legacy branch..."
              git clone --depth=1 --branch legacy https://github.com/KernelSU-Next/KernelSU-Next.git
              ln -sf ../KernelSU-Next/kernel drivers/kernelsu
              if [ -f ksu-patches/0001-sepolicy-exynos-flex-array.patch ]; then
                echo "Applying Samsung Exynos flex_array sepolicy patch to KernelSU-Next..."
                (cd KernelSU-Next && patch -p1 < ../ksu-patches/0001-sepolicy-exynos-flex-array.patch)
              fi
              echo "DEFCONFIG=exynos7885-m20_ksu_next_defconfig" >> $GITHUB_ENV
              echo "EDITION=Onyx-KSUN" >> $GITHUB_ENV
              echo "ZIP_NAME=Pox-Kernel-1.0.0-Beta-Onyx-KSUN-m20lte.zip" >> $GITHUB_ENV
              ;;
            vanilla|*)
              echo "Clean Onyx (Vanilla) build..."
              echo "DEFCONFIG=exynos7885-m20_gsi_defconfig" >> $GITHUB_ENV
              echo "EDITION=Onyx" >> $GITHUB_ENV
              echo "ZIP_NAME=Pox-Kernel-1.0.0-Beta-Onyx-m20lte.zip" >> $GITHUB_ENV
              ;;
          esac

      - name: Build Pox Kernel
        run: |
          set -e
          echo "=== Build Parameters ==="
          echo "Variant: ${{ matrix.variant }}"
          echo "Defconfig: $DEFCONFIG"
          echo "Edition: $EDITION"

          export ARCH=arm64
          export PLATFORM_VERSION=11
          export ANDROID_MAJOR_VERSION=r
          export CROSS_COMPILE=$PWD/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-
          export CCACHE_DIR=$HOME/.ccache

          mkdir -p out
          make ARCH=arm64 "$DEFCONFIG"
          make ARCH=arm64 -j$(nproc) Image dtbs modules 2>&1 | tee out/build.log

          echo "=== Build Outputs ==="
          ls -lh arch/arm64/boot/Image || true
          find . -maxdepth 4 -name "*.ko" | head

      - name: Package AnyKernel3 + raw Image
        run: |
          set -e
          chmod +x tools/package_ak3.sh
          bash tools/package_ak3.sh "${{ matrix.variant }}" "$EDITION" "$ZIP_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pox-kernel-1.0.0-beta-${{ matrix.variant }}-m20lte
          path: dist/
          if-no-files-found: error
