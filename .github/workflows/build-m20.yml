name: Build Pox Kernel for Samsung Galaxy M20 (m20lte)

on:
  push:
    branches: [onyx, main]
  workflow_dispatch:

jobs:
  build:
    name: Build Pox Kernel (${{ matrix.variant }})
    # Each variant is pinned to one runner on purpose: the self-hosted
    # workspace persists between jobs, so a variant that lands on the same VM
    # reuses its object tree (17 min -> ~1 min). Letting GitHub pick freely
    # shuffles variants across VMs and rebuilds from scratch every time.
    runs-on: [self-hosted, "${{ matrix.runner }}"]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: vanilla,  runner: m20lte-1 }
          - { variant: apatch,   runner: m20lte-2 }
          - { variant: ksu-next, runner: m20lte-3 }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Only the build needs the tree; full history just costs minutes of
          # clone time on every run.
          fetch-depth: 1

      - name: Install deps (22.04-compatible)
        run: |
          # Self-hosted runners keep $HOME for the whole session, so the apt
          # round-trip only has to happen once per VM instead of once per job.
          if [ -f "$HOME/.m20-deps-ok" ]; then
            echo "build tools already installed on this runner"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libncurses-dev \
            ccache zip unzip cpio device-tree-compiler lzop libtinfo6 \
            gcc make python3 curl || true
          sudo apt-get install -y lib32z1 lib32stdc++6 2>/dev/null || true
          sudo ln -sf /usr/bin/python3 /usr/bin/python 2>/dev/null || true
          which ccache gcc python3 make dtc || true
          touch "$HOME/.m20-deps-ok"

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          # Shared prefix: ksu-next and apatch reuse vanilla's objects because
          # ccache hashes content, not the variant name.
          key: m20-${{ matrix.variant }}
          max-size: 2G

      - name: Show toolchain
        run: |
          chmod +x prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/* || true
          prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-gcc --version || true
          gcc --version
          python3 --version
          make --version | head -1

      - name: Prepare variant (${{ matrix.variant }})
        run: |
          set -e
          case "${{ matrix.variant }}" in
            apatch)
              echo "Applying APatch patch..."
              patch -p1 < patches/apatch.patch
              echo "DEFCONFIG=exynos7885-m20_apatch_defconfig" >> $GITHUB_ENV
              echo "EDITION=Onyx-APatch" >> $GITHUB_ENV
              echo "ZIP_NAME=Pox-Kernel-2.0-Onyx-APatch-m20lte.zip" >> $GITHUB_ENV
              ;;
            ksu-next)
              echo "Applying KernelSU-Next patch..."
              patch -p1 < patches/ksu.patch
              echo "Cloning KernelSU-Next legacy branch..."
              git clone --depth=1 --branch legacy https://github.com/KernelSU-Next/KernelSU-Next.git
              ln -sf ../KernelSU-Next/kernel drivers/kernelsu
              if [ -f ksu-patches/0001-sepolicy-exynos-flex-array.patch ]; then
                echo "Applying Samsung Exynos flex_array sepolicy patch to KernelSU-Next..."
                (cd KernelSU-Next && patch -p1 -N < ../ksu-patches/0001-sepolicy-exynos-flex-array.patch || true)
              fi
              echo "DEFCONFIG=exynos7885-m20_ksu_next_defconfig" >> $GITHUB_ENV
              echo "EDITION=Onyx-KSUN" >> $GITHUB_ENV
              echo "ZIP_NAME=Pox-Kernel-2.0-Onyx-KSUN-m20lte.zip" >> $GITHUB_ENV
              ;;
            vanilla|*)
              echo "Clean Onyx (Vanilla) build..."
              echo "DEFCONFIG=exynos7885-m20_gsi_defconfig" >> $GITHUB_ENV
              echo "EDITION=Onyx" >> $GITHUB_ENV
              echo "ZIP_NAME=Pox-Kernel-2.0-Onyx-m20lte.zip" >> $GITHUB_ENV
              ;;
          esac

      - name: Build Pox Kernel
        run: |
          set -e
          echo "=== Build Parameters ==="
          echo "Variant: ${{ matrix.variant }}"
          echo "Defconfig: $DEFCONFIG"
          echo "Edition: $EDITION"

          export ARCH=arm64
          export PLATFORM_VERSION=11
          export ANDROID_MAJOR_VERSION=r
          export CROSS_COMPILE=$PWD/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-
          export CCACHE_DIR=$HOME/.ccache
          # Without this kbuild calls the compiler directly and ccache is a
          # no-op (it was installed but never wired in).
          export CC="ccache ${CROSS_COMPILE}gcc"
          # ccache stats live in the cache dir and are cumulative; zero them so
          # `ccache -s` below reports this run instead of all time.
          ccache -z >/dev/null 2>&1 || true

          mkdir -p out
          make ARCH=arm64 "$DEFCONFIG"
          make ARCH=arm64 -j$(nproc) Image dtbs modules 2>&1 | tee out/build.log
          ccache -s || true

          echo "=== Build Outputs ==="
          ls -lh arch/arm64/boot/Image || true
          find . -maxdepth 4 -name "*.ko" | head

      - name: Package AnyKernel3 + raw Image
        run: |
          set -e
          chmod +x tools/package_ak3.sh
          bash tools/package_ak3.sh "${{ matrix.variant }}" "$EDITION" "$ZIP_NAME"

      - name: Upload AnyKernel3 flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: Pox-Kernel-2.0-${{ env.EDITION }}-m20lte-AnyKernel3
          path: dist/${{ env.ZIP_NAME }}
          if-no-files-found: error

      - name: Upload build outputs and logs
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs-${{ matrix.variant }}-m20lte
          path: |
            dist/Image-m20lte
            dist/build.log
            dist/defconfig_used
          if-no-files-found: warn
