name: Build Pox Kernel for Samsung Galaxy M20 (m20lte)

on:
  push:
    branches: [grapheneos-fixes, onyx, main]
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig to build'
        required: false
        default: 'exynos7885-m20_gsi_defconfig'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install deps (22.04-compatible, best-effort)
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libncurses-dev \
            ccache zip unzip cpio device-tree-compiler lzop libtinfo6 \
            gcc make python3 || true
          sudo apt-get install -y lib32z1 lib32stdc++6 2>/dev/null || true
          sudo ln -sf /usr/bin/python3 /usr/bin/python 2>/dev/null || true
          which ccache gcc python3 make dtc || true

      - name: Show toolchain
        run: |
          ls prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/ || true
          chmod +x prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/* || true
          prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-gcc --version || true
          gcc --version
          python --version
          make --version | head -1

      - name: Build Pox Kernel (m20 GSI)
        run: |
          set -e
          DEFCONFIG="${{ github.event.inputs.defconfig }}"
          if [ -z "$DEFCONFIG" ]; then DEFCONFIG="exynos7885-m20_gsi_defconfig"; fi
          echo "DEFCONFIG=$DEFCONFIG"
          export ARCH=arm64
          export PLATFORM_VERSION=11
          export ANDROID_MAJOR_VERSION=r
          export CROSS_COMPILE=$PWD/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-
          export CCACHE_DIR=$HOME/.ccache
          mkdir -p out
          make ARCH=arm64 $DEFCONFIG
          make ARCH=arm64 -j$(nproc) Image dtbs modules 2>&1 | tee out/build.log
          echo "=== outputs ==="
          ls -lh arch/arm64/boot/Image || true
          ls -lh arch/arm64/boot/dts/exynos/*.dtb 2>/dev/null | head || true
          find . -maxdepth 4 -name "*.ko" | head

      - name: Package AnyKernel3 + raw Image
        run: |
          set -e
          export ARCH=arm64
          mkdir -p dist
          cp arch/arm64/boot/Image dist/Image-m20lte-pox-onyx
          mkdir -p dist/modules
          find . -name "*.ko" -exec cp {} dist/modules/ \; || true
          cp out/build.log dist/ || true
          cp .config dist/defconfig_used || true

          # Clone AnyKernel3 template and package flashable zip
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git dist/AnyKernel3-template || true
          rm -rf AnyKernel3
          cp -r dist/AnyKernel3-template AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/.github
          cp dist/Image-m20lte-pox-onyx AnyKernel3/zImage 2>/dev/null || cp dist/Image AnyKernel3/zImage || true

          cat > AnyKernel3/anykernel.sh << 'EOS'
          # AnyKernel3 Ramdisk Mod Script
          # Pox Kernel 1.0.0-Beta-Onyx for Samsung Galaxy M20 (m20lte) by txorav

          ### AnyKernel setup
          # global properties
          properties() { '
          kernel.string=Pox Kernel 1.0.0-Beta-Onyx for Samsung Galaxy M20 (m20lte) by txorav
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=m20lte
          device.name2=m20ltedd
          device.name3=m20
          device.name4=universal7885
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          ### AnyKernel install
          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          } # end attributes

          # boot shell variables
          BLOCK=auto;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh;

          # boot install - kernel only, keep stock ramdisk
          dump_boot;

          write_boot;
          ## end boot install
          EOS
          (cd AnyKernel3 && zip -r9 ../dist/Pox-Kernel-1.0.0-Beta-Onyx-m20lte.zip . -x .git/\* .github/\*)
          cp dist/Pox-Kernel-1.0.0-Beta-Onyx-m20lte.zip dist/AnyKernel3-m20lte-pox-onyx.zip
          rm -rf dist/AnyKernel3 dist/AnyKernel3-template
          ls -lh dist/
          echo "FLASH THIS FILE IN TWRP/ORANGEFOX: dist/Pox-Kernel-1.0.0-Beta-Onyx-m20lte.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pox-kernel-1.0.0-beta-onyx-m20lte
          path: dist/
          if-no-files-found: error
